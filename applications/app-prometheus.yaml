apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    curso: gitops
spec:
  project: default
  # source:
  #   repoURL: https://prometheus-community.github.io/helm-charts
  #   chart: prometheus
  #   targetRevision: 29.33.0
  #   helm:
  #     releaseName: prometheus
  #     parameters:
  #       - name: server.service.type
  #         value: LoadBalancer
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.33.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/prometheus/values.yaml
        parameters:
          - name: server.service.type
            value: LoadBalancer
    - repoURL: https://github.com/andresramilo/web-page-deploy.git
      targetRevision: HEAD
      ref: values
  destination:
    namespace: monitoramento
    server: https://kubernetes.default.svc
